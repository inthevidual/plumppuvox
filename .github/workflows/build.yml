name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
          - name: macOS-AppleSilicon
            os: macos-latest
          - name: Linux-x64
            os: ubuntu-22.04
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libfreetype6-dev libfontconfig1-dev

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/engine
          key: engine-${{ matrix.name }}-${{ hashFiles('engine/Cargo.lock', 'engine/src/**') }}
          restore-keys: engine-${{ matrix.name }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLUMPPUVOX_BUILD_TOOLS=ON

      - name: Build
        shell: bash
        # One compile per core: a bare --parallel lets make start every file
        # at once, which ran the Linux runner out of memory and crawled on macOS
        run: |
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)
          cmake --build build --config Release --parallel "$cores"

      - name: Check latency at 44.1, 48 and 96 kHz
        shell: bash
        run: |
          for t in plumppuvox_tool plumppulagom_tool; do
            tool=$(find build/${t}_artefacts -type f \( -name $t -o -name $t.exe \) | head -1)
            "$tool" latency 48000 512
            "$tool" latency 44100 256
            "$tool" latency 96000 1024
          done

      - name: Self-checks (colours, interface, Lagom's loudness targets)
        shell: bash
        run: |
          for t in plumppuvox_tool plumppulagom_tool; do
            tool=$(find build/${t}_artefacts -type f \( -name $t -o -name $t.exe \) | head -1)
            "$tool" selfcheck
          done

      - name: Radiomix self-check (two synthetic mics; levelling, automix, outputs)
        shell: bash
        run: |
          app=$(find build/PlumppuRadiomix_artefacts -type f \( -name "Plumppu Radiomix" -o -name "Plumppu Radiomix.exe" \) | head -1)
          "$app" --selfcheck

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/PlumppuVox_artefacts/Release/VST3/PlumppuVox.vst3
          codesign --force --deep --sign - build/PlumppuLagom_artefacts/Release/VST3/PlumppuLagom.vst3
          codesign --force --deep --sign - "build/PlumppuRadiomix_artefacts/Release/Plumppu Radiomix.app"

      - name: Package
        shell: bash
        run: |
          mkdir dist dist-lagom
          cp -R build/PlumppuVox_artefacts/Release/VST3/PlumppuVox.vst3 dist/
          cp LICENSE README.md dist/
          cp -R build/PlumppuLagom_artefacts/Release/VST3/PlumppuLagom.vst3 dist-lagom/
          cp LICENSE dist-lagom/
          cp lagom/README.md dist-lagom/
          mkdir dist-radiomix
          if [ "$RUNNER_OS" = macOS ]; then
            cp -R "build/PlumppuRadiomix_artefacts/Release/Plumppu Radiomix.app" dist-radiomix/
          elif [ "$RUNNER_OS" = Windows ]; then
            cp "build/PlumppuRadiomix_artefacts/Release/Plumppu Radiomix.exe" dist-radiomix/
          else
            cp "build/PlumppuRadiomix_artefacts/Release/Plumppu Radiomix" dist-radiomix/
          fi
          cp LICENSE radiomix/README.md dist-radiomix/

      - uses: actions/upload-artifact@v4
        with:
          name: PlumppuVox-${{ matrix.name }}
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: PlumppuLagom-${{ matrix.name }}
          path: dist-lagom

      - uses: actions/upload-artifact@v4
        with:
          name: PlumppuRadiomix-${{ matrix.name }}
          path: dist-radiomix

      # Zipped on each platform with its own tool, so the macOS bundles keep
      # their signatures and permissions intact.
      - name: Zip for release
        shell: bash
        run: |
          mkdir release
          zipit() {
            local zipfile="$PWD/release/$2-${{ matrix.name }}.zip"
            ( cd "$1"
              if [ "$RUNNER_OS" = macOS ]; then
                ditto -c -k --keepParent "$2.vst3" "$zipfile"
              elif [ "$RUNNER_OS" = Windows ]; then
                7z a -tzip "$zipfile" "$2.vst3" > /dev/null
              else
                zip -qry "$zipfile" "$2.vst3"
              fi )
          }
          zipit dist PlumppuVox
          zipit dist-lagom PlumppuLagom
          # the app: everything in its folder
          radiozip="$PWD/release/PlumppuRadiomix-${{ matrix.name }}.zip"
          ( cd dist-radiomix
            if [ "$RUNNER_OS" = macOS ]; then
              ditto -c -k --keepParent "Plumppu Radiomix.app" "$radiozip"
            elif [ "$RUNNER_OS" = Windows ]; then
              7z a -tzip "$radiozip" . > /dev/null
            else
              zip -qry "$radiozip" .
            fi )

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release

  # Every push to main replaces the "main-build" release, so its download
  # links always point at the newest build.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      - name: Publish main-build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete main-build --yes --cleanup-tag || true
          gh release create main-build release/*.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build from main" \
            --notes "Built automatically from ${GITHUB_SHA::7}."
